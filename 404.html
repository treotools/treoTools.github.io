<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Redirecting…</title>
  <!-- No-JS fallback: forwards to the new site root -->
  <meta http-equiv="refresh" content="0; url=https://treobytesdev.github.io/treoTools.github.io/">
  <link rel="canonical" href="https://treobytesdev.github.io/treoTools.github.io/">
  <script>
    // Old site lived at the root (https://treotools.github.io/...), new site
    // lives under /treoTools.github.io/. Prepend the new base so deep links
    // (e.g. /reports.html -> /treoTools.github.io/reports.html) keep working.
    (function () {
      var base = "https://treobytesdev.github.io/treoTools.github.io";
      var dest = base + window.location.pathname + window.location.search + window.location.hash;
      window.location.replace(dest);
    })();
  </script>
  <style>
    body { font-family: system-ui, -apple-system, Segoe UI, Roboto, sans-serif;
           margin: 0; min-height: 100vh; display: grid; place-items: center;
           background: #0d1117; color: #c9d1d9; text-align: center; padding: 1.5rem; }
    a { color: #58a6ff; }
  </style>
</head>
<body>
  <main>
    <p>This site has moved.</p>
    <p>If you are not redirected automatically,
       <a href="https://treobytesdev.github.io/treoTools.github.io/">click here to continue</a>.</p>
  </main>
</body>
</html>
